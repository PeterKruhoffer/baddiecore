services:
  cms:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      BADDIE_ADMIN_PASSWORD: ${BADDIE_ADMIN_PASSWORD:-}
      BADDIE_SECURE_COOKIE: ${BADDIE_SECURE_COOKIE:-false}
      BADDIE_ORIGIN: ${BADDIE_ORIGIN:-}
      BADDIE_CONTENT_API_KEY: ${BADDIE_CONTENT_API_KEY:-}
      BADDIE_COMPONENT_API_KEY: ${BADDIE_COMPONENT_API_KEY:-}
      DATABASE_URL: mysql://baddiecore:${MYSQL_PASSWORD:?Set a URL-safe MYSQL_PASSWORD in .env}@mysql:3306/baddiecore
    depends_on:
      mysql:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: baddiecore
      MYSQL_USER: baddiecore
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set a URL-safe MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u baddiecore -D baddiecore -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  mysql_data:
