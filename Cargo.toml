[package]
name = "baddiecore"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
axum-extra = { version = "0.10", features = ["cookie"] }
mysql = { version = "28", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2"
sha2 = "0.10"
serde_yaml_ng = "0.10"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
argon2 = "0.6.0"
url = "2"
rpassword = "7.5.4"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
